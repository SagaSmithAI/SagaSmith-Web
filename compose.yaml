name: sagasmith-service

services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["sagasmith-service"]
    environment:
      SAGASMITH_EXCHANGE_DIR: /srv/sagasmith/exchange
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 24
    volumes:
      - exchange-data:/srv/sagasmith/exchange
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      dnd-mcp:
        condition: service_healthy
      agent:
        condition: service_healthy
    restart: unless-stopped

  module-worker:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["sagasmith-module-worker"]
    entrypoint: []
    environment:
      SAGASMITH_EXCHANGE_DIR: /srv/sagasmith/exchange
    expose: ["9101"]
    volumes:
      - exchange-data:/srv/sagasmith/exchange
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      dnd-mcp:
        condition: service_healthy
      agent:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  dnd-mcp:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.dnd-mcp
      additional_contexts:
        core: ${SAGASMITH_CORE_CONTEXT:-https://github.com/SagaSmithAI/sagasmith-core.git#028cf19391279953ed353def04f0b2dbf918dbbc}
        dnd: ${SAGASMITH_DND_CONTEXT:-https://github.com/SagaSmithAI/sagasmith-dnd.git#346ec293442171c4ae80272c6b4e9d30b608d0a3}
        dnd_mcp: ${SAGASMITH_DND_MCP_CONTEXT:-https://github.com/SagaSmithAI/SagaSmith-dnd-mcp.git#2219d18aee53014adb7cb4b768313d6aa033cf28}
        dnd_skills: ${SAGASMITH_DND_SKILLS_CONTEXT:-https://github.com/SagaSmithAI/SagaSmith-dnd-skills.git#1e44c39b36e5802337c9ed0f76d6f9e0b0549729}
        module_gen_skills: ${SAGASMITH_MODULE_GEN_SKILLS_CONTEXT:-https://github.com/SagaSmithAI/SagaSmith-module-gen-skills.git#6a6261f52a88dab7bb360df6dbfcd1443b500bbd}
    environment:
      SAGASMITH_DND_MCP_TRANSPORT: streamable-http
      SAGASMITH_DND_MCP_HTTP_HOST: 0.0.0.0
      SAGASMITH_DND_MCP_HTTP_PORT: 8767
      SAGASMITH_DND_MCP_HOME: /state
      SAGASMITH_DND_MCP_DENSE_ENABLED: "0"
      SAGASMITH_DND_SKILLS_DIR: /build/SagaSmith-dnd-skills
      SAGASMITH_MODULEGEN_SKILLS_DIR: /build/SagaSmith-module-gen-skills
      SAGASMITH_DND_MCP_RULE_IMPORT_ROOTS: /srv/sagasmith/exchange
      SAGASMITH_DND_MCP_MODULE_IMPORT_ROOTS: /srv/sagasmith/exchange
    volumes:
      - dnd-state:/state
      - exchange-data:/srv/sagasmith/exchange
    expose: ["8767"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8767), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.agent-supervisor
      additional_contexts:
        agent_source: ${SAGASMITH_AGENT_CONTEXT:-https://github.com/SagaSmithAI/SagaSmith-agent.git#211782e99269f10cb3dcfed2f5ce26bfd0be2330}
        dnd_skills: ${SAGASMITH_DND_SKILLS_CONTEXT:-https://github.com/SagaSmithAI/SagaSmith-dnd-skills.git#1e44c39b36e5802337c9ed0f76d6f9e0b0549729}
        module_gen_skills: ${SAGASMITH_MODULE_GEN_SKILLS_CONTEXT:-https://github.com/SagaSmithAI/SagaSmith-module-gen-skills.git#6a6261f52a88dab7bb360df6dbfcd1443b500bbd}
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      SAGASMITH_AGENT_INTERNAL_KEY: ${SAGASMITH_AGENT_INTERNAL_KEY:?set SAGASMITH_AGENT_INTERNAL_KEY}
      SAGASMITH_AGENT_CONFIG: /config/agent-config.json
      SAGASMITH_AGENT_WORKSPACES: /workspaces
      SAGASMITH_AGENT_TRUSTED_MCP_HOSTS: dnd-mcp
    volumes:
      - ./secrets/agent-config.json:/config/agent-config.json:ro
      - agent-workspace:/workspaces
    expose: ["8910"]
    depends_on:
      dnd-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8910/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  proxy:
    image: caddy:2.10-alpine
    environment:
      SAGASMITH_SITE_ADDRESS: ${SAGASMITH_SITE_ADDRESS:-:80}
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on: ["api"]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sagasmith_service
      POSTGRES_USER: sagasmith
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagasmith -d sagasmith_service"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: sagasmith
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  object-data:
  exchange-data:
  dnd-state:
  agent-workspace:
  caddy-data:
  caddy-config:
