name: sagasmith-service

services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["sagasmith-service"]
    environment:
      SAGASMITH_EXCHANGE_DIR: /srv/sagasmith/exchange
      SAGASMITH_SERVICE_INTERNAL_URL: http://api:8080
      SAGASMITH_DND_MCP_URL: ${SAGASMITH_DND_MCP_URL:-http://dnd-mcp:8767/mcp}
      SAGASMITH_COC_MCP_URL: ${SAGASMITH_COC_MCP_URL:-http://coc-mcp:8768/mcp}
      SAGASMITH_AUTH_CONTEXT_SECRET: ${SAGASMITH_AUTH_CONTEXT_SECRET:?set SAGASMITH_AUTH_CONTEXT_SECRET}
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/ready', timeout=15)"]
      interval: 5s
      timeout: 20s
      retries: 24
    volumes:
      - exchange-data:/srv/sagasmith/exchange
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      dnd-mcp:
        condition: service_healthy
      coc-mcp:
        condition: service_healthy
      agent:
        condition: service_healthy
    restart: unless-stopped

  module-worker:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["sagasmith-module-worker"]
    entrypoint: []
    environment:
      SAGASMITH_EXCHANGE_DIR: /srv/sagasmith/exchange
      SAGASMITH_AUTH_CONTEXT_SECRET: ${SAGASMITH_AUTH_CONTEXT_SECRET:?set SAGASMITH_AUTH_CONTEXT_SECRET}
    expose: ["9101"]
    volumes:
      - exchange-data:/srv/sagasmith/exchange
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      dnd-mcp:
        condition: service_healthy
      agent:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  dnd-mcp:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.dnd-mcp
      additional_contexts:
        core: ${SAGASMITH_CORE_CONTEXT:-https://github.com/SagaSmithAI/sagasmith-core.git#08ac611cfa8e551231028d181c5c3bf2727ee0f7}
        dnd_domain: ${SAGASMITH_DND_CONTEXT:-https://github.com/SagaSmithAI/sagasmith-dnd.git#e5b87e55e1f08564d154e4d7cb568d936bc6edfe}
    environment:
      SAGASMITH_DND_MCP_TRANSPORT: streamable-http
      SAGASMITH_DND_MCP_HTTP_HOST: 0.0.0.0
      SAGASMITH_DND_MCP_HTTP_PORT: 8767
      SAGASMITH_DND_MCP_HOME: /state
      SAGASMITH_DND_MCP_DENSE_ENABLED: "0"
      SAGASMITH_DND_SKILLS_DIR: /build/sagasmith-dnd/skills
      SAGASMITH_MODULEGEN_SKILLS_DIR: /build/sagasmith-dnd/skills/dnd-module-generator
      SAGASMITH_DND_MCP_RULE_IMPORT_ROOTS: /srv/sagasmith/exchange
      SAGASMITH_DND_MCP_MODULE_IMPORT_ROOTS: /srv/sagasmith/exchange
      SAGASMITH_AUTH_CONTEXT_SECRET: ${SAGASMITH_AUTH_CONTEXT_SECRET:?set SAGASMITH_AUTH_CONTEXT_SECRET}
    volumes:
      - dnd-state:/state
      - exchange-data:/srv/sagasmith/exchange
    expose: ["8767"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8767), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  coc-mcp:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.coc-mcp
      additional_contexts:
        core: ${SAGASMITH_CORE_CONTEXT:-https://github.com/SagaSmithAI/sagasmith-core.git#08ac611cfa8e551231028d181c5c3bf2727ee0f7}
        coc_domain: ${SAGASMITH_COC_CONTEXT:-https://github.com/SagaSmithAI/sagasmith-coc.git#36ded279e27acda86609bc3c6ee0c99c568218c7}
    environment:
      SAGASMITH_COC_MCP_TRANSPORT: streamable-http
      SAGASMITH_COC_MCP_HTTP_HOST: 0.0.0.0
      SAGASMITH_COC_MCP_HTTP_PORT: 8768
      SAGASMITH_COC_MCP_HOME: /state
      SAGASMITH_COC_MCP_DENSE_ENABLED: "0"
      SAGASMITH_COC_SKILLS_DIR: /build/sagasmith-coc/skills
      SAGASMITH_MODULEGEN_SKILLS_DIR: /build/sagasmith-coc/skills/coc-module-generator
      SAGASMITH_COC_MCP_MODULE_IMPORT_ROOTS: /srv/sagasmith/exchange
      SAGASMITH_AUTH_CONTEXT_SECRET: ${SAGASMITH_AUTH_CONTEXT_SECRET:?set SAGASMITH_AUTH_CONTEXT_SECRET}
    volumes:
      - coc-state:/state
      - exchange-data:/srv/sagasmith/exchange
    expose: ["8768"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8768), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.agent-supervisor
      additional_contexts:
        agent_source: ${SAGASMITH_AGENT_CONTEXT:-https://github.com/SagaSmithAI/SagaSmith-agent.git#00101286bed728758da9dbddc21003cd17c8db00}
        core: ${SAGASMITH_CORE_CONTEXT:-https://github.com/SagaSmithAI/sagasmith-core.git#08ac611cfa8e551231028d181c5c3bf2727ee0f7}
        dnd_domain: ${SAGASMITH_DND_CONTEXT:-https://github.com/SagaSmithAI/sagasmith-dnd.git#e5b87e55e1f08564d154e4d7cb568d936bc6edfe}
        coc_domain: ${SAGASMITH_COC_CONTEXT:-https://github.com/SagaSmithAI/sagasmith-coc.git#36ded279e27acda86609bc3c6ee0c99c568218c7}
        narrative_domain: ${SAGASMITH_NARRATIVE_CONTEXT:-https://github.com/SagaSmithAI/sagasmith-narrative.git#35c1510996237648298fb56d23ef4b9e5ff39a81}
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      SAGASMITH_AGENT_INTERNAL_KEY: ${SAGASMITH_AGENT_INTERNAL_KEY:?set SAGASMITH_AGENT_INTERNAL_KEY}
      SAGASMITH_AGENT_CONFIG: /config/agent-config.json
      SAGASMITH_AGENT_WORKSPACES: /workspaces
      SAGASMITH_AGENT_COMPLETION_TIMEOUT_SECONDS: ${SAGASMITH_AGENT_COMPLETION_TIMEOUT_SECONDS:-900}
      SAGASMITH_AGENT_IDLE_SECONDS: ${SAGASMITH_AGENT_IDLE_SECONDS:-1800}
      SAGASMITH_AGENT_MAX_WORKERS: ${SAGASMITH_AGENT_MAX_WORKERS:-64}
      SAGASMITH_AGENT_SPAWN_CONCURRENCY: ${SAGASMITH_AGENT_SPAWN_CONCURRENCY:-4}
      SAGASMITH_AGENT_TRUSTED_MCP_HOSTS: dnd-mcp,coc-mcp
      SAGASMITH_AUTH_CONTEXT_SECRET: ${SAGASMITH_AUTH_CONTEXT_SECRET:?set SAGASMITH_AUTH_CONTEXT_SECRET}
    volumes:
      - ./secrets/agent-config.json:/config/agent-config.json:ro
      - agent-workspace:/workspaces
    expose: ["8910"]
    depends_on:
      dnd-mcp:
        condition: service_healthy
      coc-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8910/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  proxy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      SAGASMITH_SITE_ADDRESS: ${SAGASMITH_SITE_ADDRESS:-:80}
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on: ["api"]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: sagasmith_service
      POSTGRES_USER: sagasmith
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagasmith -d sagasmith_service"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: sagasmith
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  object-data:
  exchange-data:
  dnd-state:
  coc-state:
  agent-workspace:
  caddy-data:
  caddy-config:
