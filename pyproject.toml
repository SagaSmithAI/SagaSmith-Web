[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sagasmith-service"
version = "0.1.0"
description = "Closed-source hosted SagaSmith control plane and D&D service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "boto3>=1.35,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=1.26,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.21,<1",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
sagasmith-service = "sagasmith_service.main:main"
sagasmith-agent-supervisor = "sagasmith_service.agent_supervisor:main"
sagasmith-hosted-agent-worker = "sagasmith_service.agent_worker:main"
sagasmith-module-worker = "sagasmith_service.module_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sagasmith_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
