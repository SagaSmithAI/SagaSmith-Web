name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run pytest --cov=sagasmith_service --cov-report=term-missing
        env:
          SAGASMITH_BROWSER_TESTS: "1"
      - name: Check all browser JavaScript
        run: >-
          find src/sagasmith_service/web -type f \( -name '*.js' -o -name '*.mjs' \)
          -print0 | xargs -0 -n1 node --check
      - name: Test browser grid state modules
        run: node --test tests/web/*.test.mjs
      - run: uv run alembic upgrade head
        env:
          SAGASMITH_DATABASE_URL: sqlite:///./migration-ci.db
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only
          MINIO_ROOT_PASSWORD: ci-only
          OPENAI_API_KEY: ci-only
          SAGASMITH_AGENT_INTERNAL_KEY: ci-only
          SAGASMITH_WORKER_SERVICE_TOKEN: ci-worker-service-token-at-least-32-bytes
          SAGASMITH_AUTH_CONTEXT_SECRET: ci-auth-context-secret-at-least-32-bytes
      - name: Validate digest-only beta production overlay
        run: docker compose -f compose.yaml -f compose.production.yaml config --quiet
        env:
          POSTGRES_PASSWORD: ci-only
          OPENAI_API_KEY: ci-only
          SAGASMITH_AGENT_INTERNAL_KEY: ci-agent-internal-key-at-least-32-bytes
          SAGASMITH_WORKER_SERVICE_TOKEN: ci-worker-service-token-at-least-32-bytes
          SAGASMITH_AUTH_CONTEXT_SECRET: ci-auth-context-secret-at-least-32-bytes
          SAGASMITH_WEB_IMAGE: ghcr.io/example/web@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SAGASMITH_AGENT_IMAGE: ghcr.io/example/agent@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          SAGASMITH_DND_IMAGE: ghcr.io/example/dnd@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          SAGASMITH_COC_IMAGE: ghcr.io/example/coc@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          SAGASMITH_OBJECT_ENDPOINT: https://sgp1.digitaloceanspaces.com
          SAGASMITH_OBJECT_REGION: sgp1
          SAGASMITH_OBJECT_BUCKET: ci-private-beta
          SAGASMITH_OBJECT_ACCESS_KEY: ci-access-key
          SAGASMITH_OBJECT_SECRET_KEY: ci-secret-key
          SAGASMITH_PROVIDER_BUDGET_ENABLED: "true"
          SAGASMITH_PROVIDER_PRICES: "{}"
          SAGASMITH_TASK_BUDGET_USD: "1"
      - run: >-
          docker compose -f compose.yaml -f compose.observability.yaml
          --profile observability config --quiet
        env:
          POSTGRES_PASSWORD: ci-only
          MINIO_ROOT_PASSWORD: ci-only
          OPENAI_API_KEY: ci-only
          SAGASMITH_AGENT_INTERNAL_KEY: ci-only
          SAGASMITH_WORKER_SERVICE_TOKEN: ci-worker-service-token-at-least-32-bytes
          SAGASMITH_AUTH_CONTEXT_SECRET: ci-auth-context-secret-at-least-32-bytes
      - run: docker build .

  container-e2e:
    runs-on: ubuntu-latest
    needs: python
    env:
      POSTGRES_PASSWORD: e2e-postgres
      MINIO_ROOT_PASSWORD: e2e-minio-secret
      OPENAI_API_KEY: e2e-only-key
      SAGASMITH_AGENT_INTERNAL_KEY: e2e-internal-agent-key
      SAGASMITH_WORKER_SERVICE_TOKEN: e2e-worker-service-token-at-least-32-bytes
      SAGASMITH_AUTH_CONTEXT_SECRET: e2e-auth-context-secret-at-least-32-bytes
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
      - run: uv sync --frozen --all-extras
      - run: mkdir -p secrets && cp tests/e2e/agent-config.json secrets/agent-config.json
      - name: Build and start the fixture dependencies
        run: >-
          docker compose -p sagasmith-service-e2e
          -f compose.yaml -f compose.e2e.yaml
          up -d --build --wait --wait-timeout 300 postgres minio
      - name: Run migrations and provision offline E2E fixture
        run: >-
          docker compose -p sagasmith-service-e2e
          -f compose.yaml -f compose.e2e.yaml
          run --build --no-deps --rm --entrypoint alembic api upgrade head
          && docker compose -p sagasmith-service-e2e
          -f compose.yaml -f compose.e2e.yaml
          run --no-deps --rm --entrypoint python api /tmp/container_e2e_fixture.py
      - name: Start the complete pinned stack
        run: >-
          docker compose -p sagasmith-service-e2e
          -f compose.yaml -f compose.e2e.yaml
          up -d --wait --wait-timeout 300
      - name: Run D&D, CoC, and Narrative hosted acceptance
        run: uv run python scripts/container_e2e.py
      - name: Run Redis, MCP restart, and Worker lifecycle acceptance
        run: uv run python scripts/container_fault_e2e.py
      - name: Collect container diagnostics
        if: failure()
        run: >-
          docker compose -p sagasmith-service-e2e
          -f compose.yaml -f compose.e2e.yaml
          logs --no-color --tail 500
      - name: Stop acceptance stack
        if: always()
        run: >-
          docker compose -p sagasmith-service-e2e
          -f compose.yaml -f compose.e2e.yaml
          down --volumes --remove-orphans
