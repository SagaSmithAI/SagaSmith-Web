version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The Hosted Agent lock is generated atomically from both projects with a review cutoff.
    exclude-paths:
      - infrastructure/agent-supervisor-requirements.txt
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Container tags and digests are coordinated through component-versions.json.
    exclude-paths:
      - Dockerfile
      - infrastructure/Dockerfile.*
