global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sagasmith-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  - job_name: sagasmith-module-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["module-worker:9101"]

  - job_name: sagasmith-agent-supervisor
    metrics_path: /metrics
    static_configs:
      - targets: ["agent:8910"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
