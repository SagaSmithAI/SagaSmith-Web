<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SagaSmith</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header><div class="brand"><span>SS</span><strong>SagaSmith</strong></div><div id="identity"></div></header>
  <main>
    <section id="auth" class="auth card">
      <div><p class="eyebrow">D&amp;D 5E · HOSTED</p><h1>你的战役，持续运转。</h1><p class="muted">云端协作层；规则、状态与随机结算仍由 D&amp;D MCP 权威处理。</p></div>
      <form id="auth-form"><div class="tabs"><button type="button" data-mode="login" class="active">登录</button><button type="button" data-mode="register">注册</button></div><label>邮箱<input name="email" type="email" required></label><label id="name-row" hidden>显示名称<input name="display_name"></label><label>密码<input name="password" type="password" required minlength="12"></label><button class="primary">进入 SagaSmith</button><p id="auth-error" class="error"></p></form>
    </section>
    <section id="app" hidden>
      <aside><button class="nav active" data-view="campaigns">战役</button><button class="nav" data-view="packs">私有 Pack</button><button class="nav" data-view="usage">用量</button><button id="logout" class="nav bottom">退出</button></aside>
      <div class="workspace">
        <section id="campaigns-view" class="view"><div class="view-head"><div><p class="eyebrow">CAMPAIGNS</p><h2>我的战役</h2></div><button id="new-campaign" class="primary">新建战役</button></div>
          <form id="invite-accept-form" class="card horizontal-form"><label>加入战役邀请<input name="token" minlength="32" placeholder="粘贴邀请代码"></label><button>接受邀请</button></form>
          <div id="campaign-list" class="grid"></div>
          <form id="campaign-form" class="card modal" hidden><h3>建立 D&amp;D 战役</h3><label>名称<input name="name" required maxlength="160"></label><label>版本<select name="edition"><option value="2024">2024</option><option value="2014">2014</option></select></label><label>升级<select name="advancement_mode"><option value="milestone">里程碑</option><option value="xp">经验值</option></select></label><div class="actions"><button type="button" data-close>取消</button><button class="primary">创建</button></div></form>
          <section id="campaign-room" hidden><button id="back-campaigns" class="link">← 返回战役</button><div class="room-head"><div><p class="eyebrow">D&amp;D 5E</p><h2 id="room-title"></h2></div><span id="room-phase" class="phase">—</span></div><div class="room-grid"><div class="card chat"><div id="messages" class="messages"></div><form id="message-form"><textarea name="content" rows="2" placeholder="描述你的行动……" required></textarea><button class="primary">发送</button></form></div><div class="campaign-tools"><section class="card sidebar-card"><h3>战役协作</h3><button id="create-invite">生成申请邀请代码</button><div id="invite-result" class="muted small"></div><h3>成员</h3><div id="members"></div></section><section id="dm-tools" class="card sidebar-card" hidden><h3>待审核申请</h3><div id="join-requests"></div><h3>Actor 权限</h3><form id="actor-binding-form"><input name="actor_id" placeholder="Actor ID" required><select name="user_id" id="actor-user" required></select><label class="check"><input name="can_control" type="checkbox" checked>可控制</label><label class="check"><input name="can_view_private" type="checkbox" checked>可看私有信息</label><button>保存权限</button></form><h3>导入私有 Pack</h3><div id="campaign-packs"></div></section></div></div></section>
        </section>
        <section id="packs-view" class="view" hidden><div class="view-head"><div><p class="eyebrow">PRIVATE LIBRARY</p><h2>私有 Pack</h2></div></div><form id="pack-form" class="card inline-form" enctype="multipart/form-data"><label>Pack ID<input name="pack_id" required></label><label>版本<input name="version" required></label><label>标题<input name="title" required></label><label>类型<select name="kind"><option value="module">模组</option><option value="addon">扩展</option><option value="preset">预设</option><option value="core_rules">核心规则</option></select></label><label>归档（.sagasmith-pack）<input name="archive" type="file" accept=".sagasmith-pack" required></label><label class="check"><input name="rights_attested" type="checkbox" value="true" required>我确认有权私下存储和使用此内容</label><button class="primary">上传至私有库</button></form><div id="pack-list" class="grid"></div></section>
        <section id="usage-view" class="view" hidden><div class="view-head"><div><p class="eyebrow">USAGE</p><h2>额度与用量</h2></div></div><div id="usage-card" class="card usage"></div><div id="usage-ledger" class="card usage"></div></section>
      </div>
    </section>
  </main><div id="toast" role="status"></div><script src="/app.js" defer></script>
</body></html>
